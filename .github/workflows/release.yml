name: Release

# Binary'ler üç durumda derlenir:
#  - release-please bir release PR'ını merge edip bu workflow'u yeni tag ile çağırınca
#  - elle bir v* tag'i push'lanınca
#  - elle çalıştırmada (workflow_dispatch) aynı binary'ler derlenir ama yalnızca
#    workflow artifact'i olarak yüklenir — release'e dokunmayan bir deneme turu
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Existing v* tag to build binaries for
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish single-file builds
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # Cross-publishing from Linux covers all three platforms because the
      # builds use neither ReadyToRun nor build-time code signing. The assembly
      # version comes from the tag so the exe's file properties match the release.
      - name: Publish
        run: |
          version_flag=""
          [[ "$TAG" == v* ]] && version_flag="-p:Version=${TAG#v}"
          for rid in win-x64 linux-x64 osx-arm64; do
            dotnet publish src/Migrator.App -c Release -r "$rid" -o "out/$rid" $version_flag
          done
          mkdir dist
          mv out/win-x64/Migrator.App.exe dist/SqlDataMigrator-win-x64.exe
          mv out/linux-x64/Migrator.App   dist/SqlDataMigrator-linux-x64
          mv out/osx-arm64/Migrator.App   dist/SqlDataMigrator-osx-arm64

      # Authenticode signing via SignPath Foundation. These steps skip themselves
      # until the SignPath repository variables and secret exist, so releases keep
      # working (unsigned) while the application is pending.
      - name: Upload unsigned Windows exe for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-exe
          path: dist/SqlDataMigrator-win-x64.exe

      - name: Sign Windows exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: mv signed/SqlDataMigrator-win-x64.exe dist/SqlDataMigrator-win-x64.exe

      # After signing on purpose: the checksums must describe the bytes people
      # actually download.
      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/

      - name: Attach binaries to the release
        if: startsWith(env.TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release-please yolu: release zaten var, dosyalar eklenir.
          # Elle tag yolu: release burada oluşturulur.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi

name: Release Please

# Version automation: derives the SemVer version from the Conventional Commits
# history. Every push to main opens/updates a "release PR" (CHANGELOG + version);
# merging that PR creates the tag and the GitHub release. feat: → minor,
# fix: → patch, feat!/BREAKING CHANGE → major; docs/chore/ci produce no release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          release-type: simple

  # A tag created by release-please with the default GITHUB_TOKEN deliberately
  # does not trigger the tag-push workflow (GitHub's recursion guard), so the
  # binaries are attached by calling that workflow from here.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

# Action versions and NuGet packages go stale quietly. This is the thing that notices.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
